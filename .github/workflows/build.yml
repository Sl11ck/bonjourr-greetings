# On every change to main: rebuild greetings.css (+ any new emoji) from src/config.json,
# commit the result, and print the exact @import line for Bonjourr in the run summary.
name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt
      - uses: actions/cache@v4          # Microsoft's source animations, so they download once
        with:
          path: src/.cache
          key: emoji-src-${{ hashFiles('src/config.json', 'src/build.py') }}
          restore-keys: emoji-src-
      - run: pip install -r src/requirements.txt
      - run: python src/build.py        # stops here, changing nothing, if config.json has a mistake
      - name: Commit the build and print the import line
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A greetings.css PREVIEW.md emoji
          if git diff --cached --quiet; then
            echo "Build output unchanged."
          else
            git commit -m "Build greetings.css"
            git pull --rebase --autostash
            git push
          fi
          sha=$(git rev-parse HEAD)
          line="@import url(https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${sha}/greetings.css);"
          echo "$line"
          {
            echo "### Bonjourr: replace the first line of your custom CSS with"
            echo '```css'
            echo "$line"
            echo '```'
            echo "This link is pinned to this exact build, so browsers cache it permanently (no flicker on new tabs)."
          } >> "$GITHUB_STEP_SUMMARY"
