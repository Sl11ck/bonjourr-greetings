# On every change to main: read greetings.csv, look up any new emoji, rebuild greetings.css,
# commit the result, and print the exact @import line for Bonjourr in the run summary.
name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Look up every emoji again (picks up newer designs or a changed precedence)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04             # pinned, so the ubuntu-latest move cannot change the build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt
      - uses: actions/cache@v6          # downloaded Microsoft images + repo indexes
        with:
          path: src/.cache
          key: emoji-src-${{ hashFiles('src/emoji-lock.json') }}
          restore-keys: emoji-src-
      - run: pip install -r src/requirements.txt
      - name: Build                     # stops here, changing nothing, if greetings.csv has a mistake
        run: python src/build.py ${{ inputs.refresh && '--refresh' || '' }}
      - name: Commit the build and print the import line
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A greetings.css PREVIEW.md emoji src/emoji-lock.json
          if git diff --cached --quiet; then
            echo "Build output unchanged."
          else
            git commit -m "Build greetings.css"
            git pull --rebase --autostash
            git push
          fi
          sha=$(git rev-parse HEAD)
          line="@import url(https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${sha}/greetings.css);"
          echo "$line"
          {
            echo "### Bonjourr: replace the first line of your custom CSS with"
            echo '```css'
            echo "$line"
            echo '```'
            echo "This link is pinned to this exact build, so browsers cache it permanently (no flicker on new tabs)."
            echo "See [PREVIEW.md](https://github.com/${GITHUB_REPOSITORY}/blob/${sha}/PREVIEW.md) for every greeting and its chances."
          } >> "$GITHUB_STEP_SUMMARY"
